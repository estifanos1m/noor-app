<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d3b">
<title>Noor — Islamic Learning</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#0b1f1e; --bg2:#0e2b29; --card:#123634; --card2:#17423f;
    --line:#1f5350; --txt:#e8f6f3; --muted:#8fb8b2;
    --accent:#2ee6a8; --accent2:#12b886; --warn:#ffb84d; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#14504b 0%,var(--bg) 55%);
    color:var(--txt); min-height:100dvh;
  }
  #app{max-width:560px;margin:0 auto;padding:18px 16px 90px}
  h1,h2,h3{margin:0 0 6px}
  h1{font-size:26px}
  h2{font-size:20px}
  h3{font-size:16px}
  p{margin:0 0 10px;line-height:1.5}
  .muted{color:var(--muted);font-size:14px}
  .small{font-size:12px}
  .center{text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  input,textarea,select{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-size:15px;font-family:inherit;margin:6px 0 12px;
  }
  input[type=radio]{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto}
  input[type=file]{padding:8px;font-size:13px}
  textarea{min-height:90px;resize:vertical}
  label{font-size:13px;color:var(--muted);display:block}
  button{
    font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:14px;
    padding:13px 18px;background:var(--accent);color:#052522;cursor:pointer;transition:.15s;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
  button.sm{padding:7px 12px;font-size:13px;border-radius:10px}
  button.big{width:100%;padding:16px;font-size:17px;margin-top:6px}
  button.danger{background:transparent;color:var(--bad);border:1.5px solid #4a2626}
  button.renew{background:#12b886;color:#fff;border:0}
  .tabs{display:flex;gap:8px;background:var(--card2);padding:5px;border-radius:14px;margin-bottom:16px}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:10px}
  .tabs button.on{background:var(--accent);color:#052522}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .topbar h2{margin:0;flex:1}
  .level{
    display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer;transition:.15s;
  }
  .level:active{transform:scale(.985)}
  .level.locked{opacity:.5;cursor:not-allowed}
  .lv-num{
    width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#052522;font-weight:800;font-size:18px;
  }
  .level.locked .lv-num{background:#2a4a48;color:var(--muted)}
  .level .meta{flex:1;min-width:0}
  .level .meta p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .badge{font-size:20px}
  .media{margin:10px 0;border-radius:14px;overflow:hidden;background:#000}
  .media iframe,.media video,.media img{width:100%;display:block;border:0}
  .media iframe{aspect-ratio:16/9;height:auto}
  .media video{max-height:60vh}
  .media audio{width:100%;background:var(--card2)}
  .lesson-text{background:var(--card2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 12px 12px 0}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2);
    border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px;margin-bottom:10px;font-weight:500;
  }
  .opt.picked{border-color:var(--accent);background:#164a44}
  .opt.right{border-color:var(--accent);background:#0f4a35;color:#b6ffe4}
  .opt.wrong{border-color:var(--bad);background:#4a1f1f;color:#ffd0d0}
  .opt .key{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#0d2b29;display:grid;place-items:center;font-size:13px;color:var(--muted)}
  .progress{height:8px;background:#0d2b29;border-radius:99px;overflow:hidden;margin:8px 0 14px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:.4s}
  .chip{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);background:#0d2b29;padding:4px 9px;border-radius:99px}
  .edit-box{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:10px 0}
  .edit-box input,.edit-box textarea{margin:6px 0}
  .feedback{padding:14px;border-radius:14px;margin-bottom:14px;font-weight:600}
  .feedback.ok{background:#0f4a35;color:#b6ffe4}
  .feedback.no{background:#4a1f1f;color:#ffd0d0}
  .flash{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--accent);color:#052522;
    padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:99}
  .hero{text-align:center;padding:30px 0 10px}
  .hero .logo{font-size:56px;line-height:1}
  
  .reminder-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 1000;
    display: grid; place-items: center; padding: 20px;
  }
  .reminder-box {
    background: var(--card); border: 2px solid var(--warn); border-radius: 20px;
    padding: 24px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .alert-banner {
    background: #4a1f1f; border: 1px solid var(--bad); color: #ffd0d0;
    padding: 12px; border-radius: 12px; margin-bottom: 14px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDC0Kuc8fSTzG5mBNvavf4s4rTKo7Vx5DQ",
  authDomain: "noor-app-8b72e.firebaseapp.com",
  projectId: "noor-app-8b72e",
  storageBucket: "noor-app-8b72e.firebasestorage.app",
  messagingSenderId: "857905665745",
  appId: "1:857905665745:web:b640a80a49bd2fa08497f0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CLOUDINARY_CLOUD_NAME = 'bzk8vaxp';
const CLOUDINARY_UPLOAD_PRESET = 'noor_uploads';
const K_SETTINGS = 'noor_settings_v1';

const DEFAULT_LEVELS = [
  {
    id: 'lv1', title: 'Level 1 · The Five Pillars of Islam',
    items: [{ type:'text', text:'Islam is built upon five pillars.' }],
    quiz: [{ q:'How many pillars?', options:['Three','Five','Seven'], answer:1, imageUrl:'' }]
  }
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ytId(u){
  const m = String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
  if (!response.ok) throw new Error('Upload failed');
  const data = await response.json();
  return data.secure_url; 
}

let state = {
  screen: 'auth', authMode: 'signin', username: null, uid: null, userProgress: {},
  levels: [], levelId: null, quiz: null, teacherUnlocked: false, editing: null,
  flash: null, loading: true, uploading: false, installPrompt: null, isStandalone: false,
  allUsers: [], blockedEmails: [], activeReminder: null, showReminder: false, reminderTemplate: ''
};

const getSettings = () => { try { const v = localStorage.getItem(K_SETTINGS); return v ? JSON.parse(v) : { pin:'1234', passMark:80 }; } catch(e) { return { pin:'1234', passMark:80 }; } };
const setSettings = s => localStorage.setItem(K_SETTINGS, JSON.stringify(s));

function getLevel(id){ return state.levels.find(l => l.id === id); }
function isUnlocked(index, userProgress){ if(index === 0) return true; return !!(userProgress && userProgress[state.levels[index-1].id]?.passed); }

function flash(msg){
  state.flash = msg;
  render();
  setTimeout(() => { state.flash = null; render(); }, 1800);
}

async function saveProgressToCloud(levelId, score, passed) {
  if(!state.uid) return;
  state.userProgress[levelId] = { passed, score, date: Date.now() };
  await setDoc(doc(db, 'users', state.uid), { progress: state.userProgress, email: state.username }, { merge: true });
}

async function loadCloudLevels() {
  try {
    const docSnap = await getDoc(doc(db, 'config', 'levels'));
    if (docSnap.exists() && docSnap.data().levels) state.levels = docSnap.data().levels;
    else { state.levels = DEFAULT_LEVELS; await setDoc(doc(db, 'config', 'levels'), { levels: DEFAULT_LEVELS }); }
  } catch (e) { state.levels = DEFAULT_LEVELS; }
}

async function saveCloudLevels(levelsArray) {
  await setDoc(doc(db, 'config', 'levels'), { levels: levelsArray }, { merge: true });
  state.levels = levelsArray;
}

async function checkSecurityAndReminders(user) {
  try {
    const blockSnap = await getDoc(doc(db, 'config', 'blocked'));
    if (blockSnap.exists()) {
      const blockedEmails = blockSnap.data().emails || [];
      if (blockedEmails.includes(user.email)) {
        await signOut(auth);
        alert("Your account has been blocked by the teacher.");
        return false;
      }
    }

    // AUTOMATED REMINDER LOGIC
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    if (userSnap.exists()) {
      const userData = userSnap.data();
      if (userData.joinedDate) {
        const days = getDaysSince(userData.joinedDate);
        if (days >= 30) {
          // Calculate which 30-day cycle they are in (1 = days 30-59, 2 = days 60-89)
          const currentCycle = Math.floor(days / 30);
          
          // Only show if they haven't dismissed THIS cycle
          if (userData.dismissedCycle !== currentCycle) {
            const templateSnap = await getDoc(doc(db, 'config', 'reminderTemplate'));
            if (templateSnap.exists() && templateSnap.data().text) {
              state.activeReminder = { text: templateSnap.data().text, cycle: currentCycle };
              state.showReminder = true;
            }
          }
        }
      }
    }
  } catch (e) { console.error("Security check failed", e); }
  return true;
}

async function fetchAllUsers() {
  state.allUsers = [];
  state.blockedEmails = [];
  
  try {
    const blockSnap = await getDoc(doc(db, 'config', 'blocked'));
    if (blockSnap.exists()) state.blockedEmails = blockSnap.data().emails || [];

    const templateSnap = await getDoc(doc(db, 'config', 'reminderTemplate'));
    if (templateSnap.exists()) state.reminderTemplate = templateSnap.data().text || '';

    const querySnapshot = await getDocs(collection(db, "users"));
    querySnapshot.forEach((doc) => {
      if(doc.id !== state.uid) state.allUsers.push({ uid: doc.id, ...doc.data() });
    });
  } catch(e) { console.error(e); }
}

function getDaysSince(dateStr) {
  if(!dateStr) return 0;
  const joined = new Date(dateStr);
  const today = new Date();
  const diffTime = Math.abs(today - joined);
  return Math.floor(diffTime / (1000 * 60 * 60 * 24));
}

function isDue(dateStr) {
  return getDaysSince(dateStr) >= 30;
}

// --- VIEWS ---
function authView(){
  return `
  <div class="hero"><div class="logo">🕌</div><h1>Noor</h1><p class="muted">Learn · Level up · Grow</p></div>
  <div class="card">
    <div class="tabs">
      <button data-act="auth-mode" data-mode="signin" class="${state.authMode==='signin'?'on':''}">Sign in</button>
      <button data-act="auth-mode" data-mode="signup" class="${state.authMode==='signup'?'on':''}">Create account</button>
    </div>
    <label>Email</label><input id="auth-user" type="email" placeholder="student@example.com">
    <label>Password</label><input id="auth-pass" type="password" placeholder="At least 6 characters">
    ${state.authMode==='signup' ? `<label>Confirm password</label><input id="auth-pass2" type="password" placeholder="Repeat password">` : ''}
    <button class="big" data-act="auth-submit" id="btn-auth">${state.authMode==='signin' ? 'Sign in' : 'Create my account'}</button>
  </div>`;
}

function homeView(){
  const levels = state.levels;
  const passed = levels.filter(l => state.userProgress?.[l.id]?.passed).length;
  const pct = Math.round((passed / Math.max(levels.length,1)) * 100);
  const cards = levels.map((lv, i) => {
    const unlocked = isUnlocked(i, state.userProgress);
    const prog = state.userProgress?.[lv.id];
    const status = prog?.passed ? `Passed · ${prog.score}%` : unlocked ? 'Ready to start' : 'Locked';
    return `<div class="level ${unlocked?'':'locked'}" ${unlocked?`data-act="open-level" data-id="${lv.id}"`:''}>
        <div class="lv-num">${i+1}</div><div class="meta"><h3>${esc(lv.title)}</h3><p>${status}</p></div>
        <div class="badge">${prog?.passed ? '✅' : unlocked ? '▶️' : '🔒'}</div>
      </div>`;
  }).join('');

  const installBtnHtml = state.isStandalone 
    ? `<button class="ghost sm" data-act="install-app" style="color:var(--muted);border-color:var(--line)">✅ Installed</button>`
    : `<button class="ghost sm" data-act="install-app" style="color:var(--warn);border-color:var(--warn)">📲 Install</button>`;

  return `
  <div class="topbar">
    <div style="flex:1;min-width:0"><p class="muted small" style="margin:0">Assalamu alaykum</p><h2 style="margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(state.username)}</h2></div>
    ${installBtnHtml}
    <button class="ghost sm" data-act="teacher-open">👩‍🏫</button>
    <button class="ghost sm" data-act="signout">Exit</button>
  </div>
  <div class="card">
    <div class="row between"><strong>Your progress</strong><span class="muted small">${passed} / ${levels.length} levels</span></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
  </div>
  ${cards}`;
}

function levelView(){
  const lv = getLevel(state.levelId);
  const items = (lv.items || []).map(it => {
    if(it.type === 'text') return `<p class="lesson-text">${esc(it.text).replace(/\n/g,'<br>')}</p>`;
    if(it.url){
      if(it.type === 'video'){
        const id = ytId(it.url);
        if(id) return `<div class="media"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe></div>`;
        return `<div class="media"><video controls src="${esc(it.url)}"></video></div>`;
      }
      if(it.type === 'image') return `<div class="media"><img src="${esc(it.url)}"></div>`;
      if(it.type === 'audio') return `<div class="media"><audio controls src="${esc(it.url)}"></audio></div>`;
    }
    return '';
  }).join('');
  const alreadyPassed = state.userProgress?.[lv.id]?.passed;
  return `<div class="topbar"><button class="ghost sm" data-act="go-home">← Back</button></div>
  <h2>${esc(lv.title)}</h2><div class="card">${items || '<p class="muted">No content yet.</p>'}</div>
  ${lv.quiz?.length ? `<button class="big" data-act="start-quiz">${alreadyPassed ? 'Retake the test' : 'Start the test'}</button>` : ''}`;
}

function quizView(){
  const lv = getLevel(state.levelId); const qs = state.quiz; const total = lv.quiz.length;
  if(qs.done){
    const pct = Math.round((qs.correct / total) * 100);
    const pass = pct >= getSettings().passMark;
    const next = state.levels[state.levels.findIndex(l => l.id === lv.id) + 1];
    return `<div class="card center"><div style="font-size:56px">${pass ? '🎉' : '📚'}</div><h2>${pass ? 'Level complete!' : 'Almost there!'}</h2>
      <div style="font-size:44px;font-weight:800;color:${pass?'var(--accent)':'var(--warn)'}">${pct}%</div>
      ${pass && next ? `<button class="big" data-act="open-level" data-id="${next.id}">Continue →</button>` : ''}
      <button class="big ghost" data-act="retry-quiz">Try again</button><button class="big ghost" data-act="go-home">Back to levels</button></div>`;
  }
  const q = lv.quiz[qs.i];
  const opts = q.options.map((o, i) => {
    let cls = 'opt';
    if(qs.checked){ if(i === q.answer) cls += ' right'; else if(i === qs.picked) cls += ' wrong'; } else if(i === qs.picked) cls += ' picked';
    return `<button class="${cls}" data-act="pick" data-i="${i}"><span class="key">${['A','B','C','D'][i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  return `<div class="topbar"><button class="ghost sm" data-act="quit-quiz">✕</button><div class="progress" style="flex:1;margin:0"><div style="width:${((qs.i)/total)*100}%"></div></div></div>
  <div class="card"><p class="muted small">Question ${qs.i+1}</p>${q.imageUrl ? `<div class="media"><img src="${esc(q.imageUrl)}"></div>` : ''}<h2>${esc(q.q)}</h2>${opts}
  ${qs.checked ? `<div class="feedback ${qs.picked === q.answer ? 'ok' : 'no'}">${qs.picked === q.answer ? '✅ Correct!' : '❌ Wrong.'}</div><button class="big" data-act="quiz-continue">Continue</button>` : `<button class="big" data-act="quiz-check" ${qs.picked===null?'disabled':''}>Check answer</button>`}</div>`;
}

function teacherGateView(){
  return `<div class="topbar"><button class="ghost sm" data-act="go-home">← Back</button></div>
  <div class="card"><h2>Teacher access</h2><input id="pin-input" type="password" placeholder="PIN"><button class="big" data-act="pin-check">Unlock</button></div>`;
}

function teacherView(){
  const activeUsers = state.allUsers.filter(u => !state.blockedEmails.includes(u.email));
  const dueUsers = activeUsers.filter(u => isDue(u.joinedDate));
  
  const alertHtml = dueUsers.length > 0 
    ? `<div class="alert-banner" style="flex-direction:column;align-items:flex-start;gap:8px;">
         <div>⚠️ ${dueUsers.length} student(s) have payment due!</div>
         <div class="muted small" style="color:#ffd0d0">${dueUsers.map(u => esc(u.email)).join(', ')}</div>
       </div>` 
    : '';

  return `
  <div class="topbar"><button class="ghost sm" data-act="go-home">← Back</button><h2 style="margin:0">Teacher panel</h2></div>
  
  ${alertHtml}

  <div class="card">
    <div class="row between"><strong>Tools</strong></div>
    <button class="big ghost" data-act="manage-students" style="margin-bottom:10px;">👥 Manage Students</button>
    <button class="big ghost" data-act="manage-reminder">🔔 Edit Auto-Reminder Message</button>
  </div>

  <div class="card">
    <div class="row between"><strong>Levels</strong><button class="ghost sm" data-act="new-level">+ New level</button></div>
    ${state.levels.map((lv, i) => `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1;min-width:0"><strong>${i+1}. ${esc(lv.title)}</strong></div>
      <button class="ghost sm" data-act="edit-level" data-id="${lv.id}">Edit</button>
      <button class="danger sm" data-act="delete-level" data-id="${lv.id}">🗑</button>
    </div>`).join('')}
  </div>

  <div class="card">
    <strong>Settings</strong><label>Pass mark (%)</label><input id="set-pass" type="number" value="${getSettings().passMark}">
    <label>Teacher PIN</label><input id="set-pin" type="text" value="${esc(getSettings().pin)}">
    <button class="big ghost" data-act="save-settings">Save settings</button>
  </div>`;
}

function manageStudentsView(){
  const activeUsers = state.allUsers.filter(u => !state.blockedEmails.includes(u.email));
  const blockedUsers = state.allUsers.filter(u => state.blockedEmails.includes(u.email));

  const renderUserRow = (u, isBlocked) => {
    const days = getDaysSince(u.joinedDate);
    const due = days >= 30 && !isBlocked;
    const joinedStr = u.joinedDate ? new Date(u.joinedDate).toLocaleDateString() : 'Unknown';
    const displayName = u.email ? u.email : "Unknown Student";

    let statusBadge = '';
    if (isBlocked) {
      statusBadge = `<span style="color:var(--muted);font-size:12px">Blocked</span>`;
    } else if (due) {
      statusBadge = `<span style="color:var(--bad);font-size:12px;font-weight:bold">⚠️ PAYMENT DUE (${days} days)</span>`;
    } else {
      statusBadge = `<span style="color:var(--accent);font-size:12px">Active (${days} days)</span>`;
    }

    return `
    <div style="padding:12px 0;border-bottom:1px solid var(--line)">
      <div class="row between" style="margin-bottom:6px;">
        <strong style="font-size:14px;word-break:break-all;color:${isBlocked?'var(--muted)':'var(--txt)'}">${esc(displayName)}</strong>
        ${isBlocked 
          ? `<button class="ghost sm" data-act="unblock-user" data-email="${esc(u.email)}">Unblock</button>`
          : `<div class="row"><button class="renew sm" data-act="renew-user" data-uid="${u.uid}">Renew 30d</button><button class="danger sm" data-act="block-user" data-email="${esc(u.email)}">Block</button></div>`
        }
      </div>
      <div class="row between">
        <span class="muted small">Joined: ${joinedStr}</span>
        ${statusBadge}
      </div>
    </div>`;
  };

  return `
  <div class="topbar"><button class="ghost sm" data-act="back-teacher">← Back</button><h2 style="margin:0">Students</h2></div>
  
  <div class="card">
    <h3 style="color:var(--accent);margin-bottom:10px;">Active Students</h3>
    <p class="muted small" style="margin-bottom:12px">Tap <b>Renew 30d</b> when a student pays to reset their timer.</p>
    ${activeUsers.length ? activeUsers.map(u => renderUserRow(u, false)).join('') : '<p class="muted">No active students.</p>'}
  </div>

  <div class="card" style="border-color: #4a2626;">
    <h3 style="color:var(--bad);margin-bottom:10px;">Blocked Students</h3>
    ${blockedUsers.length ? blockedUsers.map(u => renderUserRow(u, true)).join('') : '<p class="muted">No blocked students.</p>'}
  </div>`;
}

function manageReminderView(){
  return `
  <div class="topbar"><button class="ghost sm" data-act="back-teacher">← Back</button><h2 style="margin:0">Auto-Reminder</h2></div>
  <div class="card">
    <p class="muted small">Type the message below. It will <b>automatically</b> pop up for any student whose 30-day due date has arrived. They will see it until they click "I Understand".</p>
    <textarea id="reminder-text" placeholder="e.g. Your monthly subscription is due. Please pay to continue learning.">${esc(state.reminderTemplate || '')}</textarea>
    <button class="big" data-act="save-reminder-template">Save Auto-Reminder Message</button>
  </div>`;
}

function itemEditor(it, i){
  if(it.type === 'text') return `<div class="edit-box"><div class="row between"><span class="chip">text</span><button class="danger sm" data-act="del-item" data-i="${i}">✕</button></div><textarea data-field="item-text" data-i="${i}">${esc(it.text||'')}</textarea></div>`;
  const hint = it.type === 'video' ? 'Video URL' : it.type === 'image' ? 'Image URL' : 'Audio URL';
  return `<div class="edit-box"><div class="row between"><span class="chip">${it.type}</span><button class="danger sm" data-act="del-item" data-i="${i}">✕</button></div>
  <input data-field="item-url" data-i="${i}" placeholder="${hint}" value="${esc(it.url||'')}">
  <input type="file" data-upload="${it.type}" data-i="${i}" accept="${it.type==='video'?'video/*':it.type==='image'?'image/*':'audio/*'}"></div>`;
}

function questionEditor(q, qi){
  const opts = q.options.map((o, oi) => `<div class="row"><input type="radio" name="ans${qi}" data-answer="${qi}" data-oi="${oi}" ${q.answer===oi?'checked':''}><input data-field="q-opt" data-qi="${qi}" data-oi="${oi}" value="${esc(o)}"></div>`).join('');
  return `<div class="edit-box"><div class="row between"><span class="chip">Q${qi+1}</span><button class="danger sm" data-act="del-q" data-qi="${qi}">✕</button></div>
  <input data-field="q-text" data-qi="${qi}" value="${esc(q.q)}">
  <label>Optional Image</label><input type="file" data-upload-qimage="${qi}" accept="image/*">
  ${opts}</div>`;
}

function editView(){
  const lv = state.editing;
  return `<div class="topbar"><button class="ghost sm" data-act="back-teacher">← Back</button><h2 style="margin:0">Edit level</h2></div>
  <div class="card"><label>Level title</label><input data-field="title" value="${esc(lv.title)}">
  ${(lv.items||[]).map(itemEditor).join('')}
  <div class="row wrap"><button class="ghost sm" data-act="add-item" data-type="text">+ Text</button><button class="ghost sm" data-act="add-item" data-type="video">+ Video</button><button class="ghost sm" data-act="add-item" data-type="image">+ Image</button></div></div>
  <div class="card"><label>Questions</label>${(lv.quiz||[]).map(questionEditor).join('')}<button class="ghost sm" data-act="add-q">+ Add question</button></div>
  <button class="big" data-act="save-level">💾 Save level</button>`;
}

function render(){
  const app = document.getElementById('app');
  let html = '';

  if(state.loading) html = `<div class="center" style="margin-top:40vh"><h2>Loading...</h2></div>`;
  else if(!state.username) html = authView();
  else if(state.screen === 'home') html = homeView();
  else if(state.screen === 'level') html = levelView();
  else if(state.screen === 'quiz') html = quizView();
  else if(state.screen === 'teacher-gate') html = teacherGateView();
  else if(state.screen === 'teacher') html = teacherView();
  else if(state.screen === 'manage-students') html = manageStudentsView();
  else if(state.screen === 'manage-reminder') html = manageReminderView();
  else if(state.screen === 'edit') html = editView();

  if(state.uploading) html += `<div class="flash" style="background:var(--warn);color:#000">Uploading...</div>`;
  app.innerHTML = html + (state.flash ? `<div class="flash">${esc(state.flash)}</div>` : '');

  if(state.showReminder && state.activeReminder) {
    app.innerHTML += `
      <div class="reminder-overlay">
        <div class="reminder-box">
          <div style="font-size:40px;margin-bottom:10px">🔔</div>
          <h2 style="color:var(--warn);margin-bottom:16px">Notice from Teacher</h2>
          <p style="font-size:18px;margin-bottom:24px;white-space:pre-wrap;">${esc(state.activeReminder.text)}</p>
          <button class="big" data-act="dismiss-reminder">I Understand</button>
        </div>
      </div>
    `;
  }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return; const act = el.dataset.act;

  if(act === 'dismiss-reminder') {
    state.showReminder = false;
    await setDoc(doc(db, 'users', state.uid), { dismissedCycle: state.activeReminder.cycle }, { merge: true });
    render(); return;
  }

  if(act === 'manage-students') {
    await fetchAllUsers();
    state.screen = 'manage-students';
    render(); return;
  }

  if(act === 'renew-user') {
    const targetUid = el.dataset.uid;
    if(!confirm('Reset this student\'s 30-day timer?')) return;
    try {
      await setDoc(doc(db, 'users', targetUid), { joinedDate: new Date().toISOString(), dismissedCycle: 0 }, { merge: true });
      flash('Student renewed for 30 days!');
      await fetchAllUsers();
      render();
    } catch(e) { flash('Error renewing user.'); }
    return;
  }

  if(act === 'block-user') {
    const email = el.dataset.email;
    if(!email) return flash('Cannot block a user without an email.');
    if(!confirm(`Block ${email}?`)) return;
    try {
      const snap = await getDoc(doc(db, 'config', 'blocked'));
      let emails = snap.exists() ? (snap.data().emails || []) : [];
      if(!emails.includes(email)) emails.push(email);
      await setDoc(doc(db, 'config', 'blocked'), { emails });
      flash('User blocked.');
      await fetchAllUsers();
      render();
    } catch(e) { flash('Error blocking user.'); }
    return;
  }

  if(act === 'unblock-user') {
    const email = el.dataset.email;
    if(!confirm(`Unblock ${email}?`)) return;
    try {
      const snap = await getDoc(doc(db, 'config', 'blocked'));
      let emails = snap.exists() ? (snap.data().emails || []) : [];
      emails = emails.filter(e => e !== email);
      await setDoc(doc(db, 'config', 'blocked'), { emails });
      flash('User unblocked.');
      await fetchAllUsers();
      render();
    } catch(e) { flash('Error unblocking user.'); }
    return;
  }

  if(act === 'manage-reminder') {
    state.screen = 'manage-reminder'; render(); return;
  }

  if(act === 'save-reminder-template') {
    const text = document.getElementById('reminder-text').value.trim();
    if(!text) return flash('Please type a message.');
    await setDoc(doc(db, 'config', 'reminderTemplate'), { text });
    state.reminderTemplate = text;
    flash('Auto-reminder saved!');
    render(); return;
  }

  if (act === 'install-app') {
    if (state.isStandalone) return flash('App is already installed!');
    if (state.installPrompt) {
      state.installPrompt.prompt();
      const { outcome } = await state.installPrompt.userChoice;
      if (outcome === 'accepted') { state.installPrompt = null; state.isStandalone = true; render(); }
    } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) flash('On iOS: Tap Share, then "Add to Home Screen"');
    else flash('Not supported by this browser.');
    return;
  }

  if(act === 'auth-mode'){ state.authMode = el.dataset.mode; render(); return; }
  if(act === 'auth-submit'){
    const email = (document.getElementById('auth-user')?.value || '').trim();
    const p = document.getElementById('auth-pass')?.value || '';
    if(!email.includes('@')) return flash('Invalid email.');
    if(p.length < 6) return flash('Password too short.');
    const btn = document.getElementById('btn-auth'); btn.disabled = true; btn.innerText = 'Connecting...';
    try {
      if(state.authMode === 'signup'){
        const p2 = document.getElementById('auth-pass2')?.value || '';
        if(p !== p2) { btn.disabled = false; btn.innerText = 'Create my account'; return flash('Passwords do not match'); }
        await createUserWithEmailAndPassword(auth, email, p);
      } else { await signInWithEmailAndPassword(auth, email, p); }
    } catch(err) {
      btn.disabled = false; btn.innerText = state.authMode === 'signin' ? 'Sign in' : 'Create my account';
      flash(err.code === 'auth/invalid-credential' ? 'Wrong email/password' : err.message);
    }
    return;
  }

  if(act === 'signout'){ await signOut(auth); state.teacherUnlocked = false; state.screen = 'auth'; return; }
  if(act === 'go-home'){ state.screen = 'home'; render(); return; }
  if(act === 'back-teacher'){ await fetchAllUsers(); state.screen = 'teacher'; render(); return; }
  if(act === 'open-level'){ state.levelId = el.dataset.id; state.screen = 'level'; render(); return; }
  if(act === 'start-quiz' || act === 'retry-quiz'){ state.quiz = { i:0, picked:null, checked:false, correct:0, done:false }; state.screen = 'quiz'; render(); return; }
  if(act === 'quit-quiz'){ state.screen = 'level'; render(); return; }
  if(act === 'pick'){ if(!state.quiz.checked){ state.quiz.picked = Number(el.dataset.i); render(); } return; }
  if(act === 'quiz-check'){
    const lv = getLevel(state.levelId); if(state.quiz.picked === null) return;
    state.quiz.checked = true; if(state.quiz.picked === lv.quiz[state.quiz.i].answer) state.quiz.correct++; render(); return;
  }
  if(act === 'quiz-continue'){
    const lv = getLevel(state.levelId); const qs = state.quiz;
    if(qs.i + 1 < lv.quiz.length){ qs.i++; qs.picked = null; qs.checked = false; render(); return; }
    qs.done = true; const pct = Math.round((qs.correct / lv.quiz.length) * 100);
    if(pct >= getSettings().passMark) await saveProgressToCloud(lv.id, pct, true); render(); return;
  }
  if(act === 'teacher-open'){ 
    if(!state.teacherUnlocked){ state.screen = 'teacher-gate'; render(); return; }
    else { await fetchAllUsers(); state.screen = 'teacher'; render(); return; }
  }
  if(act === 'pin-check'){
    if(document.getElementById('pin-input').value === getSettings().pin){ 
      state.teacherUnlocked = true; await fetchAllUsers(); state.screen = 'teacher'; render(); 
    } else flash('Wrong PIN'); return;
  }
  if(act === 'new-level'){ state.editing = { id: 'lv'+Date.now(), title: 'New level', items: [], quiz: [] }; state.screen = 'edit'; render(); return; }
  if(act === 'edit-level'){ state.editing = JSON.parse(JSON.stringify(state.levels.find(l => l.id === el.dataset.id))); state.screen = 'edit'; render(); return; }
  if(act === 'delete-level'){ if(confirm('Delete?')){ const u = state.levels.filter(l => l.id !== el.dataset.id); await saveCloudLevels(u); render(); } return; }
  if(act === 'save-settings'){
    const s = getSettings(); s.passMark = Math.min(100, Math.max(10, Number(document.getElementById('set-pass').value) || 80));
    const pin = document.getElementById('set-pin').value.trim(); if(pin) s.pin = pin; setSettings(s); flash('Settings saved'); return;
  }
  if(act === 'add-item'){ const t = el.dataset.type; state.editing.items.push(t==='text'?{type:'text',text:''}:{type:t,url:''}); render(); return; }
  if(act === 'del-item'){ state.editing.items.splice(Number(el.dataset.i), 1); render(); return; }
  if(act === 'add-q'){ state.editing.quiz.push({ q:'', options:['','','',''], answer:0, imageUrl:'' }); render(); return; }
  if(act === 'del-q'){ state.editing.quiz.splice(Number(el.dataset.qi), 1); render(); return; }
  if(act === 'save-level'){
    const lv = state.editing; if(!lv.title.trim()) return flash('Title required');
    lv.quiz = (lv.quiz || []).filter(q => q.q.trim() && q.options.some(o => o.trim()));
    state.uploading = true; render();
    const updated = [...state.levels]; const idx = updated.findIndex(l => l.id === lv.id);
    if(idx >= 0) updated[idx] = lv; else updated.push(lv);
    await saveCloudLevels(updated);
    state.uploading = false; state.screen = 'teacher'; flash('Saved!'); return;
  }
});

document.addEventListener('input', e => {
  const t = e.target; if(!state.editing) return;
  if(t.dataset.field === 'title') state.editing.title = t.value;
  if(t.dataset.field === 'item-text') state.editing.items[Number(t.dataset.i)].text = t.value;
  if(t.dataset.field === 'item-url') state.editing.items[Number(t.dataset.i)].url = t.value;
  if(t.dataset.field === 'q-text') state.editing.quiz[Number(t.dataset.qi)].q = t.value;
  if(t.dataset.field === 'q-opt') state.editing.quiz[Number(t.dataset.qi)].options[Number(t.dataset.oi)] = t.value;
});

document.addEventListener('change', async e => {
  const t = e.target;
  if(t.dataset.answer !== undefined && state.editing){ state.editing.quiz[Number(t.dataset.answer)].answer = Number(t.dataset.oi); return; }
  
  if(t.dataset.uploadQimage !== undefined && state.editing){
    const file = t.files && t.files[0]; if(!file) return;
    state.uploading = true; render();
    try {
      const url = await uploadToCloudinary(file);
      state.editing.quiz[Number(t.dataset.uploadQimage)].imageUrl = url;
      state.uploading = false; render(); flash('Image uploaded');
    } catch(err) { state.uploading = false; render(); flash('Upload failed'); }
    return;
  }

  if(t.dataset.upload && state.editing){
    const file = t.files && t.files[0]; if(!file) return;
    state.uploading = true; render();
    try {
      const url = await uploadToCloudinary(file);
      state.editing.items[Number(t.dataset.i)].url = url;
      state.uploading = false; render(); flash('File uploaded');
    } catch(err) { state.uploading = false; render(); flash('Upload failed'); }
  }
});

if(!localStorage.getItem(K_SETTINGS)) setSettings({ pin:'1234', passMark:80 });
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) state.isStandalone = true;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); state.installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { state.installPrompt = null; state.isStandalone = true; render(); flash('App installed! 🎉'); });

onAuthStateChanged(auth, async (user) => {
  state.teacherUnlocked = false;
  if (user) {
    const allowed = await checkSecurityAndReminders(user);
    if(!allowed) return; 

    state.uid = user.uid;
    state.username = user.email;
    
    try {
      const docRef = doc(db, 'users', user.uid);
      const docSnap = await getDoc(docRef);
      
      if (docSnap.exists()) {
        let updates = {};
        if (!docSnap.data().joinedDate) updates.joinedDate = new Date().toISOString();
        if (!docSnap.data().email) updates.email = user.email;
        
        if (Object.keys(updates).length > 0) await setDoc(docRef, updates, { merge: true });
        state.userProgress = docSnap.data().progress || {};
      } else {
        await setDoc(docRef, { joinedDate: new Date().toISOString(), email: user.email, progress: {} });
        state.userProgress = {};
      }
    } catch (e) { state.userProgress = {}; }

    await loadCloudLevels();
    state.screen = 'home'; state.loading = false; render();
  } else {
    state.username = null; state.uid = null; state.screen = 'auth'; state.loading = false; render();
  }
});
</script>
<script>
  if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log(err)); }); }
</script>
