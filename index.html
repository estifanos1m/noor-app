<style>
  :root{
    --bg:#0b1f1e; --bg2:#0e2b29; --card:#123634; --card2:#17423f;
    --line:#1f5350; --txt:#e8f6f3; --muted:#8fb8b2;
    --accent:#2ee6a8; --accent2:#12b886; --warn:#ffb84d; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#14504b 0%,var(--bg) 55%);
    color:var(--txt); min-height:100dvh;
  }
  #app{max-width:560px;margin:0 auto;padding:18px 16px 90px}
  h1,h2,h3{margin:0 0 6px}
  h1{font-size:26px}
  h2{font-size:20px}
  h3{font-size:16px}
  p{margin:0 0 10px;line-height:1.5}
  .muted{color:var(--muted);font-size:14px}
  .small{font-size:12px}
  .center{text-align:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  input,textarea,select{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);font-size:15px;font-family:inherit;margin:6px 0 12px;
  }
  input[type=radio]{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto}
  input[type=file]{padding:8px;font-size:13px}
  textarea{min-height:90px;resize:vertical}
  label{font-size:13px;color:var(--muted);display:block}
  button{
    font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:14px;
    padding:13px 18px;background:var(--accent);color:#052522;cursor:pointer;transition:.15s;
  }
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
  button.sm{padding:7px 12px;font-size:13px;border-radius:10px}
  button.big{width:100%;padding:16px;font-size:17px;margin-top:6px}
  button.danger{background:transparent;color:var(--bad);border:1.5px solid #4a2626}
  button.renew{background:#12b886;color:#fff;border:0}
  button.warn{background:var(--warn);color:#000;border:0}
  .tabs{display:flex;gap:8px;background:var(--card2);padding:5px;border-radius:14px;margin-bottom:16px}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:10px}
  .tabs button.on{background:var(--accent);color:#052522}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .topbar h2{margin:0;flex:1}
  .level{
    display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer;transition:.15s;
  }
  .level:active{transform:scale(.985)}
  .level.locked{opacity:.5;cursor:not-allowed}
  .lv-num{
    width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#052522;font-weight:800;font-size:18px;
  }
  .level.locked .lv-num{background:#2a4a48;color:var(--muted)}
  .level .meta{flex:1;min-width:0}
  .level .meta p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .badge{font-size:20px}
  .media{margin:10px 0;border-radius:14px;overflow:hidden;background:#000;position:relative}
  .media img {cursor:pointer;}
  .media iframe,.media video,.media img{width:100%;display:block;border:0}
  .media iframe{aspect-ratio:16/9;height:auto}
  .media video{max-height:60vh}
  .media audio{width:100%;background:var(--card2)}
  .fullscreen-hint {
    position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); 
    color: white; padding: 4px 8px; border-radius: 6px; font-size: 10px; pointer-events: none;
  }
  .lesson-text{background:var(--card2);border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 12px 12px 0}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2);
    border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px;margin-bottom:10px;font-weight:500;
  }
  .opt.picked{border-color:var(--accent);background:#164a44}
  .opt .key{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:#0d2b29;display:grid;place-items:center;font-size:13px;color:var(--muted)}
  .progress{height:8px;background:#0d2b29;border-radius:99px;overflow:hidden;margin:8px 0 14px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:.4s}
  .chip{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);background:#0d2b29;padding:4px 9px;border-radius:99px}
  .edit-box{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:10px 0}
  .edit-box input,.edit-box textarea{margin:6px 0}
  .flash{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--accent);color:#052522;
    padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:99}
  .hero{text-align:center;padding:30px 0 10px}
  .hero .logo{font-size:56px;line-height:1}
  
  .payment-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg); z-index: 1000;
    display: flex; flex-direction: column; justify-content: center; padding: 20px;
  }
  .payment-box {
    background: var(--card); border: 2px solid var(--bad); border-radius: 20px;
    padding: 24px; max-width: 400px; width: 100%; margin: 0 auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .alert-banner {
    background: #4a1f1f; border: 1px solid var(--bad); color: #ffd0d0;
    padding: 12px; border-radius: 12px; margin-bottom: 14px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pay-link { color: var(--accent); text-decoration: underline; font-weight: bold; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 1000;
    display: flex; justify-content: center; align-items: center; padding: 20px;
  }
  .modal-box {
    background: var(--card); border: 2px solid var(--accent); border-radius: 20px;
    padding: 24px; max-width: 400px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  /* SECURITY FEATURES */
  .security-blur {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(11, 31, 30, 0.98); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: var(--bad); text-align: center; padding: 20px;
  }

  body.student-mode {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  body.student-mode img, body.student-mode video {
    pointer-events: auto;
  }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDC0Kuc8fSTzG5mBNvavf4s4rTKo7Vx5DQ",
  authDomain: "noor-app-8b72e.firebaseapp.com",
  projectId: "noor-app-8b72e",
  storageBucket: "noor-app-8b72e.firebasestorage.app",
  messagingSenderId: "857905665745",
  appId: "1:857905665745:web:b640a80a49bd2fa08497f0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CLOUDINARY_CLOUD_NAME = 'bzk8vaxp';
const CLOUDINARY_UPLOAD_PRESET = 'noor_uploads';
const K_SETTINGS = 'noor_settings_v1';
const TEACHER_EMAIL = 'yasinmubarek75@gmail.com';
const PAYMENT_CYCLE_DAYS = 60; 

const DEFAULT_LEVELS = [
  {
    id: 'lv1', title: 'ደረጃ 1 · የእስልምና አምስቱ ምሰሶዎች',
    items: [{ type:'text', text:'እስልምና በአምስት ምሰሶዎች ላይ የተመሰረተ ነው።' }],
    quiz: [{ q:'ስንት ምሰሶዎች አሉ?', options:['ሶስት','አምስት','ሰባት'], answer:1, imageUrl:'' }]
  }
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function linkify(text) {
  if (!text) return '';
  const escaped = esc(text);
  const urlRegex = /(https?:\/\/[^\s<]+)/g;
  return escaped.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer" class="pay-link">$1</a>');
}

function ytId(u){
  const m = String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
  if (!response.ok) throw new Error('Upload failed');
  const data = await response.json();
  return data.secure_url; 
}

let state = {
  screen: 'auth', authMode: 'signin', username: null, uid: null, userProgress: {},
  levels: [], levelId: null, quiz: null, teacherUnlocked: false, editing: null,
  flash: null, loading: true, uploading: false, installPrompt: null, isStandalone: false,
  allUsers: [], blockedEmails: [], paymentDetails: '', 
  isPaymentBlocked: false, isPendingApproval: false, paymentStatus: 'active', userJoinedDate: null,
  isAppBlurred: false, showInstallGuide: false
};

const getSettings = () => { try { const v = localStorage.getItem(K_SETTINGS); return v ? JSON.parse(v) : { pin:'1234', passMark:80 }; } catch(e) { return { pin:'1234', passMark:80 }; } };
const setSettings = s => localStorage.setItem(K_SETTINGS, JSON.stringify(s));

function getLevel(id){ return state.levels.find(l => l.id === id); }
function isUnlocked(index, userProgress){ if(index === 0) return true; return !!(userProgress && userProgress[state.levels[index-1].id]?.passed); }

function flash(msg){
  state.flash = msg;
  render();
  setTimeout(() => { state.flash = null; render(); }, 1800);
}

async function saveProgressToCloud(levelId, score, passed) {
  if(!state.uid) return;
  state.userProgress[levelId] = { passed, score, date: Date.now() };
  await setDoc(doc(db, 'users', state.uid), { progress: state.userProgress, email: state.username }, { merge: true });
}

async function loadCloudLevels() {
  try {
    const docSnap = await getDoc(doc(db, 'config', 'levels'));
    if (docSnap.exists() && docSnap.data().levels) state.levels = docSnap.data().levels;
    else { state.levels = DEFAULT_LEVELS; await setDoc(doc(db, 'config', 'levels'), { levels: DEFAULT_LEVELS }); }
  } catch (e) { state.levels = DEFAULT_LEVELS; }
}

async function saveCloudLevels(levelsArray) {
  await setDoc(doc(db, 'config', 'levels'), { levels: levelsArray }, { merge: true });
  state.levels = levelsArray;
}

async function checkSecurityAndPayments(user) {
  state.isPendingApproval = false;
  state.isPaymentBlocked = false;

  try {
    const blockSnap = await getDoc(doc(db, 'config', 'blocked'));
    if (blockSnap.exists()) {
      const blockedEmails = blockSnap.data().emails || [];
      if (blockedEmails.includes(user.email)) {
        await signOut(auth);
        alert("አካውንትዎ በመምህሩ ታግዷል።");
        return false;
      }
    }

    const userSnap = await getDoc(doc(db, 'users', user.uid));
    if (userSnap.exists()) {
      const userData = userSnap.data();
      state.userJoinedDate = userData.joinedDate;
      state.paymentStatus = userData.paymentStatus || 'active';
      const userStatus = userData.status || 'pending'; 

      if (user.email !== TEACHER_EMAIL && userStatus === 'pending') {
        const paySnap = await getDoc(doc(db, 'config', 'paymentDetails'));
        if (paySnap.exists()) state.paymentDetails = paySnap.data().text || 'እባክዎ መምህሩን ያግኙ።';
        state.isPendingApproval = true;
        return true; 
      }

      if (user.email !== TEACHER_EMAIL && userStatus === 'approved') {
        const days = getDaysSince(userData.joinedDate);
        if (days >= PAYMENT_CYCLE_DAYS && state.paymentStatus !== 'active') {
          const paySnap = await getDoc(doc(db, 'config', 'paymentDetails'));
          if (paySnap.exists()) state.paymentDetails = paySnap.data().text || 'እባክዎ መምህሩን ያግኙ።';
          state.isPaymentBlocked = true;
        }
      }
    }
  } catch (e) { console.error("Security check failed", e); }
  return true;
}

async function fetchAllUsers() {
  state.allUsers = [];
  state.blockedEmails = [];
  
  try {
    const blockSnap = await getDoc(doc(db, 'config', 'blocked'));
    if (blockSnap.exists()) state.blockedEmails = blockSnap.data().emails || [];

    const paySnap = await getDoc(doc(db, 'config', 'paymentDetails'));
    if (paySnap.exists()) state.paymentDetails = paySnap.data().text || '';

    const querySnapshot = await getDocs(collection(db, "users"));
    querySnapshot.forEach((doc) => {
      if(doc.id !== state.uid) state.allUsers.push({ uid: doc.id, ...doc.data() });
    });
  } catch(e) { console.error(e); }
}

function getDaysSince(dateStr) {
  if(!dateStr) return 0;
  const joined = new Date(dateStr);
  const today = new Date();
  const diffTime = Math.abs(today - joined);
  return Math.floor(diffTime / (1000 * 60 * 60 * 24));
}

function isDue(dateStr, status, userStatus) {
  return userStatus === 'approved' && getDaysSince(dateStr) >= PAYMENT_CYCLE_DAYS && status !== 'active';
}

// --- VIEWS ---
function authView(){
  return `
  <div class="hero"><div class="logo">🕌</div><h1>ኑር</h1><p class="muted">ተማር · ደረጃ ከፍ አድርግ · አድግ</p></div>
  <div class="card">
    <div class="tabs">
      <button data-act="auth-mode" data-mode="signin" class="${state.authMode==='signin'?'on':''}">ግባ</button>
      <button data-act="auth-mode" data-mode="signup" class="${state.authMode==='signup'?'on':''}">አካውንት ፍጠር</button>
    </div>
    <label>ስም / የተጠቃሚ ስም</label>
    <input id="auth-user" type="text" placeholder="ለምሳሌ፡ yasin" autocomplete="username">
    <p class="muted small" style="margin-top:-6px;margin-bottom:12px;">@gmail.com በራሱ ይጨመራል።</p>
    
    <label>የይለፍ ቃል</label>
    <input id="auth-pass" type="password" placeholder="ቢያንስ 6 ፊደሎች">
    
    ${state.authMode==='signup' ? `<label>የይለፍ ቃል አረጋግጥ</label><input id="auth-pass2" type="password" placeholder="የይለፍ ቃል ድገም">` : ''}
    <button class="big" data-act="auth-submit" id="btn-auth">${state.authMode==='signin' ? 'ግባ' : 'አካውንቴን ፍጠር'}</button>
  </div>`;
}

function homeView(){
  const levels = state.levels;
  const passed = levels.filter(l => state.userProgress?.[l.id]?.passed).length;
  const pct = Math.round((passed / Math.max(levels.length,1)) * 100);
  const cards = levels.map((lv, i) => {
    const unlocked = isUnlocked(i, state.userProgress);
    const prog = state.userProgress?.[lv.id];
    const status = prog?.passed ? `አልፏል · ${prog.score}%` : unlocked ? 'ለመጀመር ተዘጋጅቷል' : 'ተቆልፏል';
    return `<div class="level ${unlocked?'':'locked'}" ${unlocked?`data-act="open-level" data-id="${lv.id}"`:''}>
        <div class="lv-num">${i+1}</div><div class="meta"><h3>${esc(lv.title)}</h3><p>${status}</p></div>
        <div class="badge">${prog?.passed ? '✅' : unlocked ? '▶️' : '🔒'}</div>
      </div>`;
  }).join('');

  const installBtnHtml = state.isStandalone 
    ? `<button class="ghost sm" data-act="install-app" style="color:var(--muted);border-color:var(--line)">✅ ተጭኗል</button>`
    : `<button class="ghost sm" data-act="install-app" style="color:var(--warn);border-color:var(--warn)">📲 ጫን</button>`;

  const teacherBtnHtml = state.username === TEACHER_EMAIL 
    ? `<button class="ghost sm" data-act="teacher-open">👩‍🏫</button>` 
    : '';

  return `
  <div class="topbar">
    <div style="flex:1;min-width:0"><p class="muted small" style="margin:0">አሰላሙ አለይኩም</p><h2 style="margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(state.username)}</h2></div>
    ${installBtnHtml}
    ${teacherBtnHtml}
    <button class="ghost sm" data-act="signout">ውጣ</button>
  </div>
  <div class="card">
    <div class="row between"><strong>የእርስዎ እድገት</strong><span class="muted small">${passed} / ${levels.length} ደረጃዎች</span></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
  </div>
  ${cards}`;
}

function levelView(){
  const lv = getLevel(state.levelId);
  const items = (lv.items || []).map(it => {
    if(it.type === 'text') return `<p class="lesson-text">${esc(it.text).replace(/\n/g,'<br>')}</p>`;
    if(it.url){
      if(it.type === 'video'){
        const id = ytId(it.url);
        if(id) return `<div class="media"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe></div>`;
        
        return `<div class="media">
          <video controls controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false;" src="${esc(it.url)}"></video>
        </div>`;
      }
      if(it.type === 'image') {
        return `<div class="media" data-act="fullscreen-img" data-url="${esc(it.url)}">
          <img src="${esc(it.url)}" alt="">
          <div class="fullscreen-hint">ለማስፋት ይንኩ</div>
        </div>`;
      }
      if(it.type === 'audio') return `<div class="media"><audio controls controlsList="nodownload" oncontextmenu="return false;" src="${esc(it.url)}"></audio></div>`;
    }
    return '';
  }).join('');
  const alreadyPassed = state.userProgress?.[lv.id]?.passed;
  return `<div class="topbar"><button class="ghost sm" data-act="go-home">← ተመለስ</button></div>
  <h2>${esc(lv.title)}</h2><div class="card">${items || '<p class="muted">እስካሁን ምንም ይዘት የለም።</p>'}</div>
  ${lv.quiz?.length ? `<button class="big" data-act="start-quiz">${alreadyPassed ? 'ፈተናውን በድጋሚ ውሰድ' : 'ፈተናውን ጀምር'}</button>` : ''}`;
}

function quizView(){
  const lv = getLevel(state.levelId); const qs = state.quiz; const total = lv.quiz.length;
  
  if(qs.done){
    const pct = Math.round((qs.correct / total) * 100);
    const pass = pct >= getSettings().passMark;
    const next = state.levels[state.levels.findIndex(l => l.id === lv.id) + 1];
    
    return `<div class="card center">
      <div style="font-size:56px">${pass ? '🎉' : '📚'}</div>
      <h2>${pass ? 'ደረጃው ተጠናቋል!' : 'አላለፉም'}</h2>
      
      <div style="font-size:44px;font-weight:800;color:${pass?'var(--accent)':'var(--bad)'}">${pct}%</div>
      <p class="muted small">${qs.correct} ከ ${total} ትክክል · ማለፊያ ነጥብ ${getSettings().passMark}%</p>
      
      ${pass 
        ? (next ? `<button class="big" data-act="open-level" data-id="${next.id}">ወደ ቀጣዩ ደረጃ ይሂዱ →</button>` : '<p class="muted" style="margin-top:10px">ሁሉንም ደረጃዎች ጨርሰዋል!</p>')
        : `<p class="muted" style="margin-top:12px; color:var(--bad)">እባክዎ ትምህርቱን ይገምግሙ እና እንደገና ይሞክሩ።</p>`}
        
      <button class="big ghost" data-act="retry-quiz">${pass ? 'ፈተናውን በድጋሚ ውሰድ' : 'እንደገና ሞክር'}</button>
      <button class="big ghost" data-act="go-home">ወደ ደረጃዎች ተመለስ</button>
    </div>`;
  }
  
  const q = lv.quiz[qs.i];
  
  const opts = q.options.map((o, i) => {
    let cls = 'opt';
    if(qs.picked === i) cls += ' picked';
    return `<button class="${cls}" data-act="pick" data-i="${i}">
      <span class="key">${['ሀ','ለ','ሐ','መ','ሠ','ረ'][i]}</span><span>${esc(o)}</span>
    </button>`;
  }).join('');
  
  let imageHtml = '';
  if(q.imageUrl) {
    imageHtml = `<div class="media" data-act="fullscreen-img" data-url="${esc(q.imageUrl)}">
      <img src="${esc(q.imageUrl)}">
      <div class="fullscreen-hint">ለማስፋት ይንኩ</div>
    </div>`;
  }

  return `<div class="topbar">
    <button class="ghost sm" data-act="quit-quiz">✕</button>
    <div class="progress" style="flex:1;margin:0"><div style="width:${((qs.i)/total)*100}%"></div></div>
    <span class="muted small">${qs.i+1}/${total}</span>
  </div>
  <div class="card">
    <p class="muted small">ጥያቄ ${qs.i+1}</p>
    ${imageHtml}
    <h2 style="margin-bottom:18px">${esc(q.q)}</h2>
    ${opts}
    
    <button class="big" data-act="quiz-next" ${qs.picked===null?'disabled':''}>
      ${qs.i === total - 1 ? 'ፈተናውን አስገባ' : 'ቀጣይ ጥያቄ'}
    </button>
  </div>`;
}

function manageStudentsView(){
  const pendingUsers = state.allUsers.filter(u => u.status === 'pending' && !state.blockedEmails.includes(u.email));
  const activeUsers = state.allUsers.filter(u => u.status === 'approved' && !state.blockedEmails.includes(u.email));
  const blockedUsers = state.allUsers.filter(u => state.blockedEmails.includes(u.email));

  const renderUserRow = (u, type) => {
    const days = getDaysSince(u.joinedDate);
    const status = u.paymentStatus || 'active';
    const isOverdue = days >= PAYMENT_CYCLE_DAYS;
    
    let statusBadge = '';
    if (type === 'blocked') {
      statusBadge = `<span style="color:var(--muted);font-size:12px">በመምህሩ ታግዷል</span>`;
    } else if (type === 'pending') {
      statusBadge = `<span style="color:var(--accent);font-size:12px;font-weight:bold">ማረጋገጫ በመጠባበቅ ላይ</span>`;
    } else if (isOverdue && status === 'pending') {
      statusBadge = `<span style="color:var(--warn);font-size:12px;font-weight:bold">🟡 ክፍያ በመጠባበቅ ላይ (${days} ቀናት)</span>`;
    } else if (isOverdue && status !== 'active') {
      statusBadge = `<span style="color:var(--bad);font-size:12px;font-weight:bold">⚠️ ተቆልፏል - አልተከፈለም (${days} ቀናት)</span>`;
    } else {
      statusBadge = `<span style="color:var(--accent);font-size:12px">ንቁ (${days} ቀናት)</span>`;
    }

    return `
    <div style="padding:12px 0;border-bottom:1px solid var(--line)">
      <div class="row between" style="margin-bottom:6px;">
        <strong style="font-size:14px;word-break:break-all;color:${type==='blocked'?'var(--muted)':'var(--txt)'}">${esc(u.email || 'ያልታወቀ')}</strong>
        ${type === 'blocked' 
          ? `<button class="ghost sm" data-act="unblock-user" data-email="${esc(u.email)}">ክፍት አድርግ</button>`
          : type === 'pending'
            ? `<button class="renew sm" data-act="approve-user" data-uid="${u.uid}">አጽድቅ</button>`
            : `<div class="row">
                ${isOverdue ? `<button class="renew sm" data-act="renew-user" data-uid="${u.uid}">ለ60 ቀናት አድስ</button>` : ''}
                <button class="danger sm" data-act="block-user" data-email="${esc(u.email)}">አግድ</button>
              </div>`
        }
      </div>
      <div class="row between">
        <span class="muted small">የተቀላቀሉበት፡ ${u.joinedDate ? new Date(u.joinedDate).toLocaleDateString() : 'ያልታወቀ'}</span>
        ${statusBadge}
      </div>
    </div>`;
  };

  return `
  <div class="topbar"><button class="ghost sm" data-act="back-teacher">← ተመለስ</button><h2 style="margin:0">ተማሪዎች</h2></div>
  
  ${pendingUsers.length ? `
  <div class="card" style="border-color: var(--accent);">
    <h3 style="color:var(--accent);margin-bottom:10px;">⏳ በመጠባበቅ ላይ ያሉ ማረጋገጫዎች</h3>
    <p class="muted small" style="margin-bottom:12px">እነዚህ ተማሪዎች አሁን አካውንት ፈጥረዋል። ከከፈሉ በኋላ <b>አጽድቅ</b> የሚለውን ይጫኑ።</p>
    ${pendingUsers.map(u => renderUserRow(u, 'pending')).join('')}
  </div>` : ''}

  <div class="card">
    <h3 style="color:var(--accent);margin-bottom:10px;">ንቁ ተማሪዎች</h3>
    <p class="muted small" style="margin-bottom:12px">አንድ ተማሪ ወርሃዊ ክፍያውን ሲከፍል የ60 ቀን ቆጣሪውን ለመጀመር <b>አድስ</b> የሚለውን ይጫኑ።</p>
    ${activeUsers.length ? activeUsers.map(u => renderUserRow(u, 'active')).join('') : '<p class="muted">ንቁ ተማሪዎች የሉም።</p>'}
  </div>

  <div class="card" style="border-color: #4a2626;">
    <h3 style="color:var(--bad);margin-bottom:10px;">የታገዱ ተማሪዎች</h3>
    ${blockedUsers.length ? blockedUsers.map(u => renderUserRow(u, 'blocked')).join('') : '<p class="muted">የታገዱ ተማሪዎች የሉም።</p>'}
  </div>`;
}

    </div>`).join('');

  return `<div class="edit-box">
    <div class="row between" style="margin-bottom:6px">
      <span class="chip">ጥያቄ ${qi+1}</span>
      <button class="danger sm" data-act="del-q" data-qi="${qi}">✕</button>
    </div>
    <input data-field="q-text" data-qi="${qi}" value="${esc(q.q)}" placeholder="የጥያቄ ጽሑፍ">
    <label>አማራጭ ምስል</label><input type="file" data-upload-qimage="${qi}" accept="image/*">
    <div class="muted small" style="margin:12px 0 4px;font-weight:bold;color:var(--accent)">ትክክለኛውን መልስ ይምረጡ፡</div>
    ${opts}
    <div class="row wrap" style="margin-top:8px">
      <button class="ghost sm" data-act="add-option" data-qi="${qi}">+ አማራጭ ጨምር</button>
      <button class="danger sm" data-act="del-option" data-qi="${qi}">✕ የመጨረሻውን አማራጭ አስወግድ</button>
    </div>
  </div>`;
}

function editView(){
  const lv = state.editing;
  return `<div class="topbar"><button class="ghost sm" data-act="back-teacher">← ተመለስ</button><h2 style="margin:0">ደረጃ አስተካክል</h2></div>
  <div class="card"><label>የደረጃው ርዕስ</label><input data-field="title" value="${esc(lv.title)}">
  ${(lv.items||[]).map(itemEditor).join('')}
  <div class="row wrap"><button class="ghost sm" data-act="add-item" data-type="text">+ ጽሑፍ</button><button class="ghost sm" data-act="add-item" data-type="video">+ ቪዲዮ</button><button class="ghost sm" data-act="add-item" data-type="image">+ ምስል</button></div></div>
  <div class="card"><label>ጥያቄዎች</label>${(lv.quiz||[]).map(questionEditor).join('')}<button class="ghost sm" data-act="add-q">+ ጥያቄ ጨምር</button></div>
  <button class="big" data-act="save-level">💾 ደረጃውን አስቀምጥ</button>`;
}

function render(){
  const app = document.getElementById('app');
  const isTeacher = state.username === TEACHER_EMAIL;
  
  if (state.username && !isTeacher) {
    document.body.classList.add('student-mode');
  } else {
    document.body.classList.remove('student-mode');
  }

  if (!isTeacher && ['teacher', 'manage-students', 'manage-payment-details', 'edit'].includes(state.screen)) {
    state.screen = 'home';
  }

  if (state.isPendingApproval && !isTeacher) {
    app.innerHTML = pendingApprovalView() + (state.flash ? `<div class="flash">${esc(state.flash)}</div>` : '');
    return;
  }

  if (state.isPaymentBlocked && !isTeacher) {
    app.innerHTML = paymentBlockedView() + (state.flash ? `<div class="flash">${esc(state.flash)}</div>` : '');
    return;
  }

  let html = '';
  if(state.loading) html = `<div class="center" style="margin-top:40vh"><h2>በመጫን ላይ...</h2></div>`;
  else if(!state.username) html = authView();
  else if(state.screen === 'home') html = homeView();
  else if(state.screen === 'level') html = levelView();
  else if(state.screen === 'quiz') html = quizView();
  else if(state.screen === 'teacher-gate') html = teacherGateView();
  else if(state.screen === 'teacher') html = teacherView();
  else if(state.screen === 'manage-students') html = manageStudentsView();
  else if(state.screen === 'manage-payment-details') html = managePaymentDetailsView();
  else if(state.screen === 'edit') html = editView();

  if(state.uploading) html += `<div class="flash" style="background:var(--warn);color:#000">በመስቀል ላይ...</div>`;
  app.innerHTML = html + (state.flash ? `<div class="flash">${esc(state.flash)}</div>` : '');

  if (state.showInstallGuide) {
    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    app.innerHTML += `
    <div class="modal-overlay">
      <div class="modal-box">
        <h2 class="center" style="color:var(--accent);margin-bottom:16px;">📲 እንዴት እንደሚጫኑ</h2>
        <div style="text-align:left; margin: 16px 0; line-height: 1.6; font-size: 15px;">
          ${isiOS ? `
            <p><strong>በiPhone (Safari) ላይ፡</strong></p>
            <p>1. ከታች ያለውን የ<b>አጋራ (Share)</b> ምልክት ይጫኑ <svg style="width:16px;height:16px;vertical-align:middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>።</p>
            <p>2. ወደታች ወርደው <b>"Add to Home Screen"</b> የሚለውን ይጫኑ።</p>
          ` : `
            <p><strong>በAndroid / ኮምፒውተር ላይ፡</strong></p>
            <p>1. የብራውዘር ምናሌውን <b>(3 ነጥቦች ⋮ ወይም ⋯)</b> ይጫኑ።</p>
            <p>2. <b>"Install app"</b> ወይም <b>"Add to Home Screen"</b> የሚለውን ይፈልጉ እና ይጫኑት።</p>
          `}
        </div>
        <button class="big" data-act="close-install-guide">ገባኝ</button>
      </div>
    </div>`;
  }

  if(state.username && !isTeacher && state.isAppBlurred) {
    app.innerHTML += `
    <div class="security-blur">
      <h2 style="font-size:30px">🚫</h2>
      <h2>ስክሪኑ ተደብቋል</h2>
      <p class="muted">እባክዎ ወደ መተግበሪያው ይመለሱ። ስክሪን መቅረጽ ወይም መተግበሪያ መቀየር አይፈቀድም።</p>
    </div>`;
  }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return; const act = el.dataset.act;

  if(act === 'close-install-guide') {
    state.showInstallGuide = false;
    render();
    return;
  }

  if(act === 'fullscreen-img') {
    const url = el.dataset.url;
    if(!url) return;
    
    const div = document.createElement('div');
    div.style.position = 'fixed';
    div.style.top = '0'; div.style.left = '0';
    div.style.width = '100vw'; div.style.height = '100vh';
    div.style.backgroundColor = 'black';
    div.style.zIndex = '999999';
    div.style.display = 'flex';
    div.style.justifyContent = 'center';
    div.style.alignItems = 'center';
    
    const img = document.createElement('img');
    img.src = url;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'contain';
    img.style.pointerEvents = 'none';
    
    div.appendChild(img);

    const closeBtn = document.createElement('div');
    closeBtn.innerHTML = '✕';
    closeBtn.style.position = 'absolute';
    closeBtn.style.top = '20px'; closeBtn.style.right = '20px';
    closeBtn.style.color = 'white'; closeBtn.style.fontSize = '30px';
    closeBtn.style.fontWeight = 'bold'; closeBtn.style.background = 'rgba(0,0,0,0.5)';
    closeBtn.style.borderRadius = '50%'; closeBtn.style.width = '40px'; closeBtn.style.height = '40px';
    closeBtn.style.display = 'flex'; closeBtn.style.justifyContent = 'center'; closeBtn.style.alignItems = 'center';
    closeBtn.style.cursor = 'pointer'; closeBtn.style.zIndex = '1000000';
    closeBtn.onclick = (e) => { e.stopPropagation(); div.remove(); };
    div.appendChild(closeBtn);

    div.addEventListener('click', (e) => { if(e.target === div) div.remove(); });
    
    document.body.appendChild(div);
    return;
  }

  if(act === 'add-option') {
    const qi = Number(el.dataset.qi);
    if(state.editing.quiz[qi].options.length < 6) {
      state.editing.quiz[qi].options.push('');
      render();
    } else { flash('ቢያንስ 6 አማራጮች ብቻ ይፈቀዳሉ'); }
    return;
  }

  if(act === 'del-option') {
    const qi = Number(el.dataset.qi);
    const q = state.editing.quiz[qi];
    if(q.options.length > 2) {
      q.options.pop();
      if(q.answer >= q.options.length) q.answer = 0;
      render();
    } else { flash('ቢያንስ 2 አማራጮች መኖር አለባቸው'); }
    return;
  }

  if(act === 'payment-done') {
    if(!confirm('ክፍያውን ጨርሰዋል? መምህሩ አረጋግጠው አካውንትዎን ይከፍቱልዎታል።')) return;
    state.paymentStatus = 'pending';
    await setDoc(doc(db, 'users', state.uid), { paymentStatus: 'pending' }, { merge: true });
    render(); return;
  }

  if(act === 'manage-students') {
    if(state.username !== TEACHER_EMAIL) return;
    await fetchAllUsers();
    state.screen = 'manage-students';
    render(); return;
  }

  if(act === 'manage-payment-details') {
    if(state.username !== TEACHER_EMAIL) return;
    state.screen = 'manage-payment-details'; render(); return;
  }

  if(act === 'save-payment-details') {
    if(state.username !== TEACHER_EMAIL) return;
    const txt = document.getElementById('pay-details').value.trim();
    await setDoc(doc(db, 'config', 'paymentDetails'), { text: txt });
    state.paymentDetails = txt;
    flash('የክፍያ ዝርዝሮች ተቀምጠዋል!');
    return;
  }

  if(act === 'approve-user') {
    if(state.username !== TEACHER_EMAIL) return;
    const targetUid = el.dataset.uid;
    if(!confirm('ይህ ተማሪ እንዲጀምር ያጽድቁ?')) return;
    try {
      await setDoc(doc(db, 'users', targetUid), { 
        status: 'approved', 
        joinedDate: new Date().toISOString(), 
        paymentStatus: 'active' 
      }, { merge: true });
      flash('ተማሪው ጸድቋል!');
      await fetchAllUsers();
      render();
    } catch(e) { flash('ተማሪውን ማጽደቅ አልተቻለም።'); }
    return;
  }

  if(act === 'renew-user') {
    if(state.username !== TEACHER_EMAIL) return;
    const targetUid = el.dataset.uid;
    if(!confirm('ክፍያውን አጽድቀው ለ60 ቀናት ይክፈቱለት?')) return;
    try {
      await setDoc(doc(db, 'users', targetUid), { joinedDate: new Date().toISOString(), paymentStatus: 'active' }, { merge: true });
      flash('ተማሪው ተከፍቶ እንደገና ተጀምሯል!');
      await fetchAllUsers();
      render();
    } catch(e) { flash('እንደገና ማስጀመር አልተቻለም።'); }
    return;
  }

  if(act === 'block-user') {
    if(state.username !== TEACHER_EMAIL) return;
    const email = el.dataset.email;
    if(!email) return flash('ኢሜይል የሌለውን ተጠቃሚ ማገድ አይቻልም።');
    if(!confirm(`${email}ን ማገድ ይፈልጋሉ?`)) return;
    try {
      const snap = await getDoc(doc(db, 'config', 'blocked'));
      let emails = snap.exists() ? (snap.data().emails || []) : [];
      if(!emails.includes(email)) emails.push(email);
      await setDoc(doc(db, 'config', 'blocked'), { emails });
      flash('ተጠቃሚው ታግዷል።');
      await fetchAllUsers();
      render();
    } catch(e) { flash('ተጠቃሚውን ማገድ አልተቻለም።'); }
    return;
  }

  if(act === 'unblock-user') {
    if(state.username !== TEACHER_EMAIL) return;
    const email = el.dataset.email;
    if(!confirm(`${email}ን ክፍት ማድረግ ይፈልጋሉ?`)) return;
    try {
      const snap = await getDoc(doc(db, 'config', 'blocked'));
      let emails = snap.exists() ? (snap.data().emails || []) : [];
      emails = emails.filter(e => e !== email);
      await setDoc(doc(db, 'config', 'blocked'), { emails });
      flash('ተጠቃሚው ክፍት ሆኗል።');
      await fetchAllUsers();
      render();
    } catch(e) { flash('ተጠቃሚውን ክፍት ማድረግ አልተቻለም።'); }
    return;
  }

  if (act === 'install-app') {
    if (state.isStandalone) return flash('መተግበሪያው አስቀድሞ ተጭኗል!');
    if (state.installPrompt) {
      state.installPrompt.prompt();
      const { outcome } = await state.installPrompt.userChoice;
      if (outcome === 'accepted') { state.installPrompt = null; state.isStandalone = true; render(); }
    } else {
      state.showInstallGuide = true;
      render();
    }
    return;
  }

  if(act === 'auth-mode'){ state.authMode = el.dataset.mode; render(); return; }
  if(act === 'auth-submit'){
    let rawInput = (document.getElementById('auth-user')?.value || '').trim();
    const p = document.getElementById('auth-pass')?.value || '';
    
    let cleanName = rawInput.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
    if(!cleanName) return flash('እባክዎ ትክክለኛ ስም ያስገቡ።');
    
    const email = cleanName + '@gmail.com';

    if(p.length < 6) return flash('የይለፍ ቃሉ በጣም አጭር ነው።');
    const btn = document.getElementById('btn-auth'); btn.disabled = true; btn.innerText = 'በመገናኘት ላይ...';
    try {
      if(state.authMode === 'signup'){
        const p2 = document.getElementById('auth-pass2')?.value || '';
        if(p !== p2) { btn.disabled = false; btn.innerText = 'አካውንቴን ፍጠር'; return flash('የይለፍ ቃላቱ አይመሳሰሉም'); }
        await createUserWithEmailAndPassword(auth, email, p);
      } else { await signInWithEmailAndPassword(auth, email, p); }
    } catch(err) {
      btn.disabled = false; btn.innerText = state.authMode === 'signin' ? 'ግባ' : 'አካውንቴን ፍጠር';
      flash(err.code === 'auth/invalid-credential' ? 'የተሳሳተ ስም/የይለፍ ቃል' : err.message);
    }
    return;
  }

  if(act === 'signout'){ 
    await signOut(auth); 
    state.teacherUnlocked = false; 
    state.screen = 'auth'; 
    state.isPaymentBlocked = false; 
    state.isPendingApproval = false;
    return; 
  }
  if(act === 'go-home'){ state.screen = 'home'; render(); return; }
  if(act === 'back-teacher'){ 
    if(state.username !== TEACHER_EMAIL) return;
    await fetchAllUsers(); state.screen = 'teacher'; render(); return; 
  }
  if(act === 'open-level'){ state.levelId = el.dataset.id; state.screen = 'level'; render(); return; }
  
  if(act === 'start-quiz' || act === 'retry-quiz'){ 
    state.quiz = { i:0, picked:null, answers:[], correct:0, done:false }; 
    state.screen = 'quiz'; 
    render(); return; 
  }
  
  if(act === 'quit-quiz'){ state.screen = 'level'; render(); return; }
  
  if(act === 'pick'){ 
    if(!state.quiz.done) {
      state.quiz.picked = Number(el.dataset.i); 
      render(); 
    }
    return; 
  }
  
  if(act === 'quiz-next'){
    const lv = getLevel(state.levelId); const qs = state.quiz;
    qs.answers[qs.i] = qs.picked;
    
    if(qs.i + 1 < lv.quiz.length){
      qs.i++; 
      qs.picked = null; 
      render(); return;
    }
    
    let correctCount = 0;
    lv.quiz.forEach((q, idx) => {
        if(qs.answers[idx] === q.answer) correctCount++;
    });
    
    qs.correct = correctCount;
    qs.done = true; 
    
    const pct = Math.round((qs.correct / lv.quiz.length) * 100);
    if(pct >= getSettings().passMark) {
      await saveProgressToCloud(lv.id, pct, true); 
    }
    render(); return;
  }

  if(act === 'teacher-open'){ 
    if(state.username !== TEACHER_EMAIL) return flash('መዳረሻ ተከልክሏል');
    if(!state.teacherUnlocked){ state.screen = 'teacher-gate'; render(); return; }
    else { await fetchAllUsers(); state.screen = 'teacher'; render(); return; }
  }
  if(act === 'pin-check'){
    if(document.getElementById('pin-input').value === getSettings().pin){ 
      state.teacherUnlocked = true; await fetchAllUsers(); state.screen = 'teacher'; render(); 
    } else flash('የተሳሳተ ፒን'); return;
  }
  if(act === 'new-level'){ 
    if(state.username !== TEACHER_EMAIL) return;
    state.editing = { id: 'lv'+Date.now(), title: 'አዲስ ደረጃ', items: [], quiz: [] }; state.screen = 'edit'; render(); return; 
  }
  if(act === 'edit-level'){ 
    if(state.username !== TEACHER_EMAIL) return;
    state.editing = JSON.parse(JSON.stringify(state.levels.find(l => l.id === el.dataset.id))); state.screen = 'edit'; render(); return; 
  }
  if(act === 'delete-level'){ 
    if(state.username !== TEACHER_EMAIL) return;
    if(confirm('ይህን ደረጃ እና ሁሉንም ይዘቱን ይሰርዙ?')){ const u = state.levels.filter(l => l.id !== el.dataset.id); await saveCloudLevels(u); render(); } return; 
  }
  if(act === 'save-settings'){
    if(state.username !== TEACHER_EMAIL) return;
    const s = getSettings(); s.passMark = Math.min(100, Math.max(10, Number(document.getElementById('set-pass').value) || 80));
    const pin = document.getElementById('set-pin').value.trim(); if(pin) s.pin = pin; setSettings(s); flash('ቅንብሮች ተቀምጠዋል'); return;
  }
  if(act === 'add-item'){ 
    if(state.username !== TEACHER_EMAIL) return;
    const t = el.dataset.type; state.editing.items.push(t==='text'?{type:'text',text:''}:{type:t,url:''}); render(); return; 
  }
  if(act === 'del-item'){ 
    if(state.username !== TEACHER_EMAIL) return;
    state.editing.items.splice(Number(el.dataset.i), 1); render(); return; 
  }
  if(act === 'add-q'){ 
    if(state.username !== TEACHER_EMAIL) return;
    state.editing.quiz.push({ q:'', options:['','','',''], answer:0, imageUrl:'' }); render(); return; 
  }
  if(act === 'del-q'){ 
    if(state.username !== TEACHER_EMAIL) return;
    state.editing.quiz.splice(Number(el.dataset.qi), 1); render(); return; 
  }
  if(act === 'save-level'){
    if(state.username !== TEACHER_EMAIL) return;
    const lv = state.editing; if(!lv.title.trim()) return flash('ርዕስ ያስፈልጋል');
    lv.quiz = (lv.quiz || []).filter(q => q.q.trim() && q.options.filter(o => o.trim()).length >= 2);
    state.uploading = true; render();
    const updated = [...state.levels]; const idx = updated.findIndex(l => l.id === lv.id);
    if(idx >= 0) updated[idx] = lv; else updated.push(lv);
    await saveCloudLevels(updated);
    state.uploading = false; state.screen = 'teacher'; flash('ተቀምጧል!'); return;
  }
});

document.addEventListener('input', e => {
  const t = e.target; if(!state.editing) return;
  if(t.dataset.field === 'title') state.editing.title = t.value;
  if(t.dataset.field === 'item-text') state.editing.items[Number(t.dataset.i)].text = t.value;
  if(t.dataset.field === 'item-url') state.editing.items[Number(t.dataset.i)].url = t.value;
  if(t.dataset.field === 'q-text') state.editing.quiz[Number(t.dataset.qi)].q = t.value;
  if(t.dataset.field === 'q-opt') state.editing.quiz[Number(t.dataset.qi)].options[Number(t.dataset.oi)] = t.value;
});

document.addEventListener('change', async e => {
  const t = e.target;
  if(t.dataset.answer !== undefined && state.editing){ state.editing.quiz[Number(t.dataset.answer)].answer = Number(t.dataset.oi); return; }
  
  if(t.dataset.uploadQimage !== undefined && state.editing){
    const file = t.files && t.files[0]; if(!file) return;
    state.uploading = true; render();
    try {
      const url = await uploadToCloudinary(file);
      state.editing.quiz[Number(t.dataset.uploadQimage)].imageUrl = url;
      state.uploading = false; render(); flash('ምስል ተሰቅሏል');
    } catch(err) { state.uploading = false; render(); flash('መስቀል አልተቻለም'); }
    return;
  }

  if(t.dataset.upload && state.editing){
    const file = t.files && t.files[0]; if(!file) return;
    state.uploading = true; render();
    try {
      const url = await uploadToCloudinary(file);
      state.editing.items[Number(t.dataset.i)].url = url;
      state.uploading = false; render(); flash('ፋይል ተሰቅሏል');
    } catch(err) { state.uploading = false; render(); flash('መስቀል አልተቻለም'); }
  }
});

document.addEventListener('contextmenu', e => {
  if (state.username && state.username !== TEACHER_EMAIL) {
    e.preventDefault();
  }
});

document.addEventListener('visibilitychange', () => {
  if (state.username && state.username !== TEACHER_EMAIL) {
    if (document.hidden) { state.isAppBlurred = true; } 
    else { state.isAppBlurred = false; }
    render();
  }
});

if(!localStorage.getItem(K_SETTINGS)) setSettings({ pin:'1234', passMark:80 });
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) state.isStandalone = true;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); state.installPrompt = e; render(); });
window.addEventListener('appinstalled', () => { state.installPrompt = null; state.isStandalone = true; render(); flash('መተግበሪያው ተጭኗል! 🎉'); });

onAuthStateChanged(auth, async (user) => {
  state.teacherUnlocked = false;
  if (user) {
    const allowed = await checkSecurityAndPayments(user);
    if(!allowed) return; 

    state.uid = user.uid;
    state.username = user.email;
    
    try {
      const docRef = doc(db, 'users', user.uid);
      const docSnap = await getDoc(docRef);
      
      if (docSnap.exists()) {
        let updates = {};
        if (!docSnap.data().joinedDate) updates.joinedDate = new Date().toISOString();
        if (!docSnap.data().email) updates.email = user.email;
        if (!docSnap.data().status) updates.status = 'pending'; 
        
        if (Object.keys(updates).length > 0) await setDoc(docRef, updates, { merge: true });
        state.userProgress = docSnap.data().progress || {};
      } else {
        await setDoc(docRef, { 
            joinedDate: new Date().toISOString(), 
            email: user.email, 
            progress: {}, 
            status: 'pending', 
            paymentStatus: 'active' 
        });
        state.userProgress = {};
      }
    } catch (e) { state.userProgress = {}; }

    await loadCloudLevels();
    state.screen = 'home'; state.loading = false; render();
  } else {
    state.username = null; state.uid = null; state.screen = 'auth'; state.loading = false; 
    state.isPaymentBlocked = false; 
    state.isPendingApproval = false;
    document.body.classList.remove('student-mode');
    render();
  }
});
</script>
<script>
  if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log(err)); }); }
</script>
